<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Busca de apartamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Ficha de vistoria: cada anúncio é uma ficha branca com campos pautados; o que decide vem conferido
   em quadros (✓, ✗ ou em branco quando o anúncio não diz). Tinta azul de caneta para valores e marcas,
   vermelho só no carimbo ALUGADO, em exclusões e erros. Só modo claro (pedido do usuário). */
:root{
  --ground:#eef1f4; --sheet:#ffffff; --ink:#1c2733; --ink-2:#4a5867; --muted:#5f6c79;
  --rule:#c9d2dc; --hair:#e3e8ee; --chip:#dde3e9; --hover:#f5f7fa;
  --pen:#1f4fd1; --pen-deep:#173ea8; --pen-wash:#e8eefc; --pen-soft:#a9bff5;
  --stamp:#c8322b; --stamp-deep:#a3241f; --stamp-wash:#fbecea; --ok:#2f7d55;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px; --r-card:8px; --gap:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--font);font-variant-numeric:tabular-nums;caret-color:var(--pen)}
::selection{background:var(--pen-wash);color:var(--pen-deep)}
*{scrollbar-color:var(--rule) transparent}
a{color:var(--pen);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:var(--pen-deep)}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.lab{display:block;font:600 11px/1.2 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* cabeçalho */
.top{background:var(--sheet);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:14px 12px;display:grid;gap:4px}
.tline{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font:700 clamp(18px,4.6vw,22px)/1.2 var(--font);letter-spacing:-.01em;text-wrap:balance}
.summary{margin:0;font:500 14px/1.35 var(--font);color:var(--ink-2)}
.summary b{color:var(--pen);font-weight:700}
.summary:empty{display:none}
.status{display:flex;flex-wrap:wrap;gap:2px 14px;font:500 12px/1.5 var(--font);color:var(--muted)}
.status span{display:inline-flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--stamp)}
.sync{font-size:13px;color:var(--ink-2);margin:0}
.sync:empty{display:none}
.sync.err{color:var(--stamp);font-weight:600}
.sync-btn{flex:none}
.sync-btn .ico{color:var(--pen)}
.sync-btn.busy .ico{animation:gira 1.1s linear infinite}
@keyframes gira{to{rotate:360deg}}

/* abas */
.tabs{position:sticky;top:0;z-index:10;background:var(--sheet);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap.more{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;font:600 14px/1 var(--font);color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:15px 10px 13px;cursor:pointer;display:flex;gap:7px;align-items:center;min-height:48px}
.tab b{font:600 12px/1 var(--font);color:var(--muted);background:var(--hover);border-radius:10px;padding:3px 7px;min-width:24px;text-align:center}
.tab b:empty{display:none}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--pen);border-bottom-color:var(--pen)}
.tab[aria-selected="true"] b{color:var(--pen);background:var(--pen-wash)}
.tab:focus-visible{outline-offset:-4px}
.tab .short{display:none}
@media (max-width:420px){
  .tabs .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;overflow:visible;padding-left:0;padding-right:0}
  .tabs .wrap,.tabs .wrap.more{-webkit-mask-image:none;mask-image:none}
  .tab{flex-direction:column;gap:4px;padding:9px 2px 7px;font-size:12px;min-height:54px;justify-content:center}
  .tab b{background:none;padding:0;font-size:13px;font-weight:700}
  .tab[aria-selected="true"] b{background:none}
  .tab .full{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tab .short{display:block;white-space:nowrap}
}

/* filtros */
.filters{background:var(--sheet);border-bottom:1px solid var(--rule)}
.filters .wrap{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding-block:10px}
.filters label{display:flex;gap:8px;align-items:center;font:500 13px var(--font);color:var(--ink-2);min-height:44px}
select,input[type=text],input[type=number],input[type=email]{font:500 15px var(--font);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:9px 10px;min-height:44px}
select:hover,input[type=text]:hover,input[type=number]:hover,input[type=email]:hover{border-color:var(--ink-2)}
select:focus-visible,input:focus-visible{outline-offset:0;border-color:var(--pen)}
::placeholder{color:var(--muted);opacity:1}
input[type=range]{accent-color:var(--pen);width:130px}
input[type=checkbox]{accent-color:var(--pen);width:18px;height:18px;margin:0}
.filters b#fMaxV{font-weight:700;color:var(--ink);min-width:72px}
.count{margin-left:auto;font:600 13px var(--font);color:var(--muted)}
.fdet{border:0;padding:0}
.fsum{display:none}

main .wrap{padding-block:16px 96px}
main .wrap:focus{outline:none}
h2{font:700 12px/1.2 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:28px 0 10px;display:flex;align-items:baseline;gap:8px}
h2:first-child{margin-top:4px}
h2 small{font:500 12px var(--font);letter-spacing:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:var(--gap);align-items:start}
/* Fichas lado a lado: foto, cabeçalho, composição, quadro e ações na mesma altura em toda a linha. */
@supports (grid-template-rows:subgrid){ @media (min-width:740px){
  .grid{row-gap:0}
  .grid>.card{display:grid;grid-row:span 5;grid-template-rows:subgrid;row-gap:0;margin-bottom:var(--gap);align-self:stretch}
  .grid>.card>.body{align-content:start}
} }

/* ficha */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-card);display:flex;flex-direction:column;min-width:0;position:relative;overflow:hidden;transition:border-color .15s}
.card.fav{border-color:var(--pen);outline:1px solid var(--pen);outline-offset:-2px}
.card.desc .photo,.card.desc .head,.card.desc .items,.card.desc .brk{opacity:.62}
.card.leaving{opacity:0;transition:height .28s cubic-bezier(.2,.8,.2,1),opacity .18s ease-out}
.photo{position:relative;overflow:hidden;background:var(--chip);container-type:inline-size}
.ph{display:flex;width:100%;height:min(60cqw,250px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.opp-card .ph{height:min(56cqw,220px)}
.ph::-webkit-scrollbar{display:none}
.ph img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block}
.ph .none{margin:auto;font:500 13px var(--font);color:var(--muted)}
.nav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border:0;border-radius:50%;background:color-mix(in srgb,var(--sheet) 92%,transparent);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.nav:hover{background:var(--sheet);color:var(--pen)}
.nav.p{left:8px}.nav.n{right:8px}
.cnt{position:absolute;right:8px;bottom:8px;background:color-mix(in srgb,var(--ink) 80%,transparent);color:var(--sheet);font:600 11px/1 var(--font);padding:5px 8px;border-radius:4px}
.flag{position:absolute;left:8px;top:8px;right:60px;display:flex;gap:6px;flex-wrap:wrap}
.flag span{font:700 11px/1 var(--font);letter-spacing:.02em;padding:6px 8px;border-radius:4px;background:var(--pen);color:var(--sheet)}
.flag span.light{background:color-mix(in srgb,var(--sheet) 95%,transparent);color:var(--ink)}
.flag span.seen{color:var(--ink-2);font-weight:600}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--rule)}
.f{padding:10px 12px;min-width:0}
.head>.f+.f{border-left:1px solid var(--rule)}
.f .lab{margin-bottom:5px}
.addr{margin:0;font:600 16px/1.3 var(--font);overflow-wrap:anywhere}
.spec{font:500 13px/1.4 var(--font);color:var(--ink-2);margin-top:3px}
.spec span{white-space:nowrap}
.ftot{text-align:right}
.ftot .lab{text-align:right}
.val{font:800 28px/1 var(--font);color:var(--pen);letter-spacing:-.02em;white-space:nowrap}
.was{display:block;font:500 12px/1.2 var(--font);color:var(--muted);text-decoration:line-through;margin-bottom:3px}
.brk{padding:7px 12px 8px;font-size:13px;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.brk .lab{margin-bottom:3px}
.brk .blank{color:var(--muted);text-decoration:underline dashed var(--rule);text-underline-offset:3px}
.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(36px,auto);border-bottom:1px solid var(--rule)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.it{display:flex;gap:8px;align-items:center;padding:7px 12px;font:500 13px/1.3 var(--font);border-top:1px solid var(--hair);min-width:0}
.it:nth-child(-n+2){border-top:0}
.it:nth-child(odd){border-right:1px solid var(--hair)}
.box{width:17px;height:17px;border:1.5px solid var(--ink-2);border-radius:4px;display:grid;place-items:center;flex:none;color:var(--ink-2)}
.box .ico{width:13px;height:13px;stroke-width:3}
.it.y .box{border-color:var(--pen);color:var(--pen)}
.it.n{color:var(--ink-2)}
.it.e{color:var(--muted)}
.it.e .box{border-style:dashed;border-color:var(--rule)}
.it.f{gap:6px;color:var(--ink)}
.it .k{font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.it.f .k::after{content:":"}
.it.ni{color:var(--muted)}
.body{padding:10px 12px 12px;display:grid;gap:10px;min-width:0}
.note{font-size:13px;padding:8px 10px;border:1px dashed var(--rule);border-radius:var(--r);margin:0;color:var(--ink-2)}
details{font-size:14px;border-top:1px solid var(--hair)}
details summary{cursor:pointer;font:600 13px var(--font);color:var(--ink);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details summary:hover{color:var(--pen)}
details summary::-webkit-details-marker{display:none}
details summary .i-close{display:none}
details[open] summary .i-open{display:none}
details[open] summary .i-close{display:block}
details summary .ico{color:var(--muted)}
details p{white-space:pre-line;margin:0 0 10px;color:var(--ink-2)}
.refs{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:13px}
.refs li{display:flex;gap:8px;min-width:0}
.refs b{min-width:98px;font-weight:600;color:var(--ink-2);flex:none}
.refs .n{min-width:0;overflow-wrap:anywhere}
.refs .m{margin-left:auto;white-space:nowrap;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.btn{font:600 14px/1 var(--font);border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);color:var(--ink);min-height:44px;padding:0 12px;display:inline-flex;gap:7px;align-items:center;justify-content:center;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--ink-2);background:var(--hover)}
.btn:active{background:var(--hair)}
.btn[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.btn[aria-pressed="true"]:hover{background:var(--pen-deep);border-color:var(--pen-deep)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.btn.primary:hover{background:var(--pen-deep);border-color:var(--pen-deep)}
.btn.danger{color:var(--stamp)}
.btn.danger:hover{background:var(--stamp-wash);border-color:var(--stamp)}
.btn.danger.confirm{background:var(--stamp);border-color:var(--stamp);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:not-allowed;background:var(--sheet);border-color:var(--rule)}
.btn[aria-pressed="true"]:disabled{background:var(--pen);border-color:var(--pen);color:var(--sheet);opacity:.5}
.links{display:flex;flex-wrap:wrap;gap:0 16px;align-items:center;font:600 14px var(--font);border-top:1px solid var(--hair);padding-top:2px}
.links a{display:inline-flex;gap:5px;align-items:center;min-height:44px;text-decoration:none}
.links a:hover{text-decoration:underline}
.links .code{margin-left:auto;font:500 12px var(--font);color:var(--muted);min-width:0;overflow-wrap:anywhere}

/* alugado: carimbo diagonal */
.card.rented{border-color:var(--rule);outline:none}
.card.rented .ph img{filter:grayscale(1) contrast(.9);opacity:.6}
.card.rented .val{color:var(--muted)}
.card.rented .head,.card.rented .items,.card.rented .brk{opacity:.7}
.tarja{position:absolute;left:-12%;right:-12%;top:40%;background:var(--stamp);color:var(--sheet);font:800 clamp(22px,7vw,28px)/1 var(--font);text-transform:uppercase;letter-spacing:.24em;text-indent:.24em;text-align:center;padding:9px 0;rotate:-12deg;pointer-events:none}
.tarja.fresh{animation:cola .45s cubic-bezier(.16,1,.3,1)}
@keyframes cola{from{scale:1.25;opacity:0;rotate:-5deg}to{scale:1;opacity:1;rotate:-12deg}}
.rentnote{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--stamp-wash);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--ink)}
.rentnote b{color:var(--stamp-deep)}

/* ficha ampliada (dialog): galeria grande + a mesma ficha; no celular, tela cheia com barra de voltar */
.addr-open{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.addr-open:hover{color:var(--pen);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.card .ph img,.card .head,.card .brk,.card .items{cursor:pointer}
html:has(.ficha[open]){overflow:hidden}
.ficha{padding:0;margin:0;border:0;width:100%;max-width:none;height:100%;max-height:none;background:var(--sheet);color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
.ficha::backdrop{background:color-mix(in srgb,var(--ink) 55%,transparent)}
.ficha[open]{animation:empurra .26s cubic-bezier(.2,.8,.2,1)}
@keyframes empurra{from{translate:28px 0;opacity:0}}
.fx-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;min-height:52px;background:var(--sheet);border-bottom:1px solid var(--rule);padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.fx-back{font:600 15px/1 var(--font);color:var(--pen);background:none;border:0;border-radius:var(--r);min-height:44px;padding:0 12px 0 6px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;transition:background-color .15s,color .15s}
.fx-back:hover{background:var(--hover);color:var(--pen-deep)}
.fx-gal{background:var(--chip);min-width:0}
.fx-stage{position:relative;overflow:hidden}
.fx-ph{display:flex;width:100%;aspect-ratio:4/3;max-height:64dvh;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.fx-ph::-webkit-scrollbar{display:none}
.fx-ph img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:start;scroll-snap-stop:always;display:block}
.fx-ph .none{margin:auto;font:500 13px var(--font);color:var(--muted)}
.fx-stage .tarja{top:44%}
.fx-thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--sheet);border-bottom:1px solid var(--rule);scrollbar-width:thin}
.fx-th{flex:none;width:68px;height:51px;padding:0;border:0;border-radius:4px;overflow:hidden;background:var(--chip);cursor:pointer;opacity:.62;transition:opacity .15s}
.fx-th img{width:100%;height:100%;object-fit:cover;display:block}
.fx-th:hover{opacity:1}
.fx-th[aria-current="true"]{opacity:1;outline:2px solid var(--pen);outline-offset:-2px}
.fx-sheet{min-width:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.ficha .addr{margin:0;font:600 18px/1.3 var(--font);letter-spacing:-.01em;text-transform:none;color:var(--ink);display:block}
.fx-f{border-top:1px solid var(--hair);padding-top:10px}
.fx-f p{margin:4px 0 0;white-space:pre-line;font-size:14px;color:var(--ink-2);max-width:66ch}
.fx-f p.ni{color:var(--muted)}
.fx-f .refs{margin:6px 0 0}
.ficha.rented .fx-ph img{filter:grayscale(1) contrast(.9);opacity:.6}
.ficha.rented .val{color:var(--muted)}
.ficha.rented .fx-sheet .head,.ficha.rented .fx-sheet .items,.ficha.rented .fx-sheet .brk{opacity:.7}
.ficha.desc .fx-sheet .head,.ficha.desc .fx-sheet .items,.ficha.desc .fx-sheet .brk{opacity:.62}
.ficha .toast{position:fixed}
@media (min-width:740px){
  .ficha{width:min(1180px,calc(100vw - 48px));height:min(860px,calc(100dvh - 48px));margin:auto;border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden}
  .ficha[open]{display:flex;flex-direction:column;animation-name:surge}
  @keyframes surge{from{translate:0 12px;opacity:0}}
  .fx-bar{padding:0 8px}
  .fx-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
  .fx-gal{display:flex;flex-direction:column;min-height:0}
  .fx-stage{flex:1;min-height:0}
  .fx-ph{aspect-ratio:auto;max-height:none;height:100%}
  .fx-thumbs{border-bottom:0;border-top:1px solid var(--rule)}
  .fx-sheet{overflow-y:auto;border-left:1px solid var(--rule);overscroll-behavior:contain}
}

/* alertas */
.alerts-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.alerts-head h2{margin:4px 0}
.lede{max-width:66ch;color:var(--ink-2);margin:6px 0 16px;font-size:14px}
.alert{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-card);margin-bottom:16px;overflow:hidden}
.alert.paused{border-style:dashed}
.alert-top{display:grid;gap:6px;padding:12px}
.alert-name{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert-name h3{margin:0;font:700 18px/1.25 var(--font);letter-spacing:-.01em}
.pill{font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:10px;background:var(--pen-wash);color:var(--pen)}
.pill.off{background:var(--hover);color:var(--muted)}
.cond{font-size:13px;color:var(--ink-2)}
.alert-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.periods{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--rule)}
.periods button{font:inherit;color:var(--ink);background:var(--sheet);border:0;border-right:1px solid var(--rule);border-bottom:2px solid transparent;padding:10px 12px 8px;cursor:pointer;text-align:left;display:grid;gap:5px;min-height:64px;align-content:space-between}
.periods button:last-child{border-right:0}
.periods button:hover{background:var(--hover)}
.periods button span{font:600 11px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.periods button b{font:700 20px/1 var(--font);letter-spacing:-.01em}
.periods button[aria-pressed="true"]{background:var(--pen-wash);border-bottom-color:var(--pen)}
.periods button[aria-pressed="true"] span,.periods button[aria-pressed="true"] b{color:var(--pen)}
.periods button:focus-visible{outline-offset:-3px}
.opps{display:grid}
.opp{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--hair);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.opps>.opp:first-child{border-top:0}
.opp:hover{background:var(--hover)}
.opp[aria-expanded="true"]{background:var(--pen-wash)}
.opp:focus-visible{outline-offset:-3px}
.thumb{position:relative;display:block;width:88px;height:66px;overflow:hidden;border-radius:4px;background:var(--chip)}
.thumb img,.thumb .noimg{width:100%;height:100%;object-fit:cover;display:block}
.opp .t{display:block;font:800 22px/1 var(--font);color:var(--pen);letter-spacing:-.02em}
.opp .w{display:block;font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;margin-top:4px}
.opp .when{font:500 12px var(--font);color:var(--muted);white-space:nowrap;align-self:start;margin-top:2px}
.mini-tarja{position:absolute;left:-14px;right:-14px;top:25px;background:var(--stamp);color:var(--sheet);font:800 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:3px 0;rotate:-12deg}
.opp.rented img{filter:grayscale(1);opacity:.6}
.opp.rented .t{color:var(--muted)}
.opp-card{padding:12px;border-top:1px solid var(--rule);background:var(--ground)}
.opp-card .card{max-width:520px}
@media (min-width:900px){ .opps{grid-template-columns:1fr 1fr} .opps>.opp:nth-child(2){border-top:0} .opps>.opp:nth-child(odd){border-right:1px solid var(--hair)} .opp-card,.opps>.empty{grid-column:1/-1} }
.empty{padding:16px 12px;color:var(--ink-2);font-size:14px;margin:0}
form.aform{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-card);padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));margin-bottom:20px}
form.aform h3{grid-column:1/-1;margin:0;font:700 18px var(--font)}
form.aform label{display:grid;gap:6px;font:600 13px var(--font);color:var(--ink-2)}
form.aform .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:4px 20px}
.checks label{display:flex!important;gap:8px;align-items:center;color:var(--ink)!important;font-weight:500!important;min-height:40px}
.formacts{display:flex;gap:8px;flex-wrap:wrap}
.hint{display:block;font:500 12px var(--font);color:var(--muted);margin-top:4px}

.login{max-width:440px;margin:40px auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-card);padding:20px;display:grid;gap:12px}
.login h2{margin:0;font-size:18px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.login label{font:600 13px var(--font);color:var(--ink-2)}
.big-empty{padding:32px 0;font-size:15px;color:var(--ink-2);max-width:60ch}
.single-back{display:inline-flex;gap:6px;align-items:center;font:600 14px var(--font);min-height:44px;margin-bottom:6px;text-decoration:none}
.single .card{max-width:560px}

/* aviso flutuante (salvo, desfazer, erro) */
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:30;display:flex;gap:14px;align-items:center;max-width:min(560px,calc(100vw - 32px));background:var(--ink);color:var(--sheet);font:500 14px/1.4 var(--font);padding:10px 10px 10px 16px;border-radius:var(--r-card);animation:sobe .22s cubic-bezier(.2,.8,.2,1)}
.toast.err{background:var(--stamp-deep)}
.toast span{padding-block:4px}
.toast button{flex:none;font:700 14px var(--font);color:var(--pen-soft);background:none;border:0;border-radius:var(--r);min-height:40px;padding:0 10px;cursor:pointer}
.toast button:hover{background:color-mix(in srgb,var(--sheet) 10%,transparent)}
.toast button:focus-visible{outline-color:var(--sheet)}
@keyframes sobe{from{opacity:0;translate:-50% 10px}}

@media (max-width:420px){
  .filters .wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding-block:0}
  .filters label{display:grid;gap:4px;font-size:12px;min-height:0}
  .filters select{width:100%}
  .filters label.inline{display:flex;align-self:end;min-height:44px;font-size:13px}
  .filters .count{display:none}
  .fsum{display:flex!important;justify-content:space-between;align-items:center;min-height:48px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));font:600 14px var(--font);cursor:pointer;list-style:none}
  .fsum::-webkit-details-marker{display:none}
  .fsum .end{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:500;font-size:13px;flex:none}
  .fsum .fs{display:grid;min-width:0;line-height:1.3;padding-block:6px}
  .fsum #fstate{font:500 12px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fdet .fsum .i-close{display:none}
  .fdet[open] .fsum .i-open{display:none}
  .fdet[open] .fsum .i-close{display:block}
  .fdet[open] .wrap{padding-bottom:12px}
  input[type=range]{width:100%}
  .acts .btn{padding:0 4px;gap:5px;font-size:13px}
  .acts .ico{width:16px;height:16px}
  .val{font-size:26px}
  .sync-btn{padding:0 10px}
}
@media (min-width:900px){ .card .acts{grid-template-columns:repeat(3,auto);justify-content:start} }
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important}
  .tarja.fresh,.toast,.sync-btn.busy .ico,.ficha[open]{animation:none}
  .fx-th,.fx-back{transition:none}
  .btn,.card{transition:none}
}

<script>
const cfg = window.APTO || {};
const DEMO = new URLSearchParams(location.search).has('demo') || !cfg.supabaseUrl || cfg.supabaseUrl.includes('SEU-PROJETO');
const sb = DEMO ? window.demoClient() : window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => n ? 'R$ ' + Number(n).toLocaleString('pt-BR') : '—';
const ico = (n, c = '') => `<svg class="ico ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const sumIco = ico('plus', 'i-open') + ico('minus', 'i-close');
const SINGLE = new URLSearchParams(location.search).get('anuncio');
const REGS = ['Pedra Branca (Palhoça)', 'São José', 'Florianópolis'];
const SRC = { vivareal: 'VivaReal', zap: 'ZAP', olx: 'OLX', ibagy: 'Ibagy', quintoandar: 'QuintoAndar', isci: 'Isci' };
const DAY = 864e5;
const PERIODS = [['d1', 'Últimas 24h', 0, DAY, 'nas últimas 24h'], ['d7', 'Últimos 7 dias', DAY, 7 * DAY, 'entre 1 e 7 dias atrás'], ['d30', 'Último mês', 7 * DAY, 30 * DAY, 'entre 7 e 30 dias atrás']];
REGS.forEach(r => $('fReg').insertAdjacentHTML('beforeend', `<option>${r}</option>`));
const narrow = matchMedia('(max-width: 420px)');
const syncFilters = () => { $('fdet').open = !narrow.matches; };
syncFilters(); narrow.addEventListener('change', syncFilters);

let L = [], marks = {}, rentals = {}, seen = {}, alerts = [], me = null, view = 'analise', editing = null, openAlert = {}, openOpp = null, freshRent = null;

/* ---------- regras ---------- */
const dropAfterMark = d => { const m = marks[d.id]; return d.price_drop_at && m && m.status === 'desc' && new Date(d.price_drop_at) > new Date(m.at); };
function rentInfo(d) {
  if (rentals[d.id]) return { manual: true, at: rentals[d.id].at, by: rentals[d.id].by_email };
  if (!d.active || d.inactive_at) return { manual: false, at: d.inactive_at || d.last_seen };
  return null;
}
function state(d) {
  const m = marks[d.id];
  if (!m) return 'none';
  if (m.status === 'desc' && dropAfterMark(d)) return 'reaberto';
  return m.status;
}
// 1 banheiro tem aba própria: sai de Em análise e Não favoritados; Favoritos e Descartados mostram todos.
const oneBath = d => d.banheiros === 1;
// Alugado (marcado ou fora do ar na fonte) vai sozinho para Descartados; volta quando o anúncio reaparece.
const inView = (d, v) => { if (rentInfo(d)) return v === 'desc'; const s = state(d); return v === 'analise' ? s !== 'desc' && !oneBath(d) : v === 'semmarca' ? (s === 'none' || s === 'reaberto') && !oneBath(d) : v === 'umban' ? s !== 'desc' && oneBath(d) : v === 'fav' ? s === 'fav' : s === 'desc'; };
/* Imobiliária: a do anúncio e as dos mesmos imóveis em outros sites. */
const anuncs = d => [...new Set([d.anunciante, ...(d.alt_urls || []).map(x => x.anunciante)].filter(Boolean))];
const NI = '__ni';
const norm = s => (s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const has = (b, n) => !!n && new RegExp('(^|\\s)' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(\\s|$)').test(b);
function alertMatch(d, a) {
  if (a.max_total && d.total > a.max_total) return false;
  if ((a.regioes || []).length && !a.regioes.includes(d.regiao)) return false;
  const b = norm(d.bairro), inc = (a.bairros_incluir || []).map(norm).filter(Boolean), exc = (a.bairros_excluir || []).map(norm).filter(Boolean);
  if (inc.length && !inc.some(x => has(b, x))) return false;
  if (exc.some(x => has(b, x))) return false;
  if (a.min_quartos && (d.quartos || 0) < a.min_quartos) return false;
  if ((d.banheiros || 0) < (a.min_banheiros || 2)) return false; // 1 banheiro só quando o alerta pede
  if (a.min_vagas && (d.vagas || 0) < a.min_vagas) return false;
  if (a.exigir_pet && d.pet !== 'SIM') return false;
  return true;
}
/* Oportunidades = anúncios novos, vistos pela primeira vez depois da criação do alerta, que atendem às condições. */
function opportunities(a) {
  const since = new Date(a.created_at || 0).getTime(), now = Date.now();
  return L.filter(d => { const t = new Date(d.first_seen).getTime(); return t >= since && now - t < 30 * DAY && alertMatch(d, a); })
    .sort((x, y) => new Date(y.first_seen) - new Date(x.first_seen));
}
const bucket = (list, p) => list.filter(d => { const age = Date.now() - new Date(d.first_seen).getTime(); return age >= p[2] && age < p[3]; });
function ago(t) {
  const s = (Date.now() - new Date(t).getTime()) / 1e3;
  if (s < 3600) return `há ${Math.max(1, Math.round(s / 60))} min`;
  if (s < 86400) return `há ${Math.round(s / 3600)} h`;
  const d = Math.round(s / 86400); return d === 1 ? 'ontem' : `há ${d} dias`;
}
const date = t => new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const who = e => !e ? 'alguém' : e === me ? 'você' : e.split('@')[0];

/* Quadro da ficha: sempre os mesmos seis campos, na mesma posição.
   Os três primeiros são critérios: y = confere, n = não confere, e = o anúncio não diz.
   Os três últimos são fatos (f) escritos por extenso, ou "não informado". */
function items(d) {
  const t = ((d.descricao || '') + ' ' + (d.amenities || []).join(' ')).toLowerCase();
  const floor = (d.amenities || []).find(x => /andar/i.test(x)) || ((t.match(/(\d+)\s*º?\s*andar/) || [])[0]);
  const gas = /aquecimento a g|aquecedor a g|caldeira|chuveiro a g/.test(t) || /g[áa]s (central|encanad|canalizad|individual)|g[áa]s com medi|g[áa]s e [áa]gua por consumo|medidores individuais de [áa]gua e g[áa]s/.test(t);
  const coz = /cozinha (separada|independente|fechada)|sala individual|cozinha e [áa]rea de servi[çc]o interna/.test(t) ? 'y' : /americana|integrad|conjugad/.test(t) ? 'n' : 'e';
  const mob = /semi.?mobil/.test(t) ? 'Semimobiliado' : /mobiliad/.test(t) && !/n[ãa]o mobiliad|sem mob|n[ãa]o significa que o im[óo]vel ser[áa] alugado mobiliado/.test(t) ? 'Mobiliado' : null;
  const cap = x => x.replace(/\s+/g, ' ').trim().replace(/^./, c => c.toUpperCase());
  return [
    [d.pet === 'SIM' ? 'y' : d.pet === 'NAO' ? 'n' : 'e', 'Aceita pet'],
    [gas ? 'y' : 'e', 'Gás encanado'],
    [coz, 'Cozinha separada'],
    floor ? ['f', 'Andar', cap(floor)] : ['f', 'Andar', null],
    ['f', 'Mobília', mob],
    ['f', 'Elevador', /elevador/.test(t) ? 'sim' : null],
  ];
}
const hasGas = d => items(d)[1][0] === 'y';
const itemHtml = ([k, label, fact]) => k === 'f'
  ? `<li class="it f${fact ? '' : ' ni'}"><span class="k">${label}</span>${fact ? esc(fact) : 'não informado'}</li>`
  : `<li class="it ${k}"><span class="box" aria-hidden="true">${k === 'y' ? ico('check') : k === 'n' ? ico('x') : ''}</span>${label}${k === 'e' ? '<span class="sr"> (não informado)</span>' : k === 'n' ? '<span class="sr">: não</span>' : '<span class="sr">: sim</span>'}</li>`;

/* ---------- card ---------- */
function slide(btn, dir) { const s = btn.parentElement.querySelector('.ph'); s.scrollBy({ left: dir * s.clientWidth, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
const dropShown = d => d.prev_total && d.prev_total > d.total && (Date.now() - new Date(d.price_drop_at) < 21 * DAY || state(d) === 'reaberto');
/* Etiquetas sobre a foto (Novo, Baixou, Favorito…) e o carimbo ALUGADO: iguais no card e na ficha ampliada. */
function overlay(d, big) {
  const st = state(d), m = marks[d.id], rent = rentInfo(d);
  const top = [Date.now() - new Date(d.first_seen) < 3 * DAY && '<span>Novo</span>', dropShown(d) && `<span>Baixou ${brl(d.prev_total - d.total)}</span>`,
    st === 'fav' && `<span class="light">Favorito${m.by_email ? ' · ' + esc(who(m.by_email)) : ''}</span>`, st === 'desc' && `<span class="light">Descartado${m.by_email ? ' · ' + esc(who(m.by_email)) : ''}</span>`,
    st === 'reaberto' && '<span class="light">Era descartado</span>', !big && seen[d.id] && `<span class="light seen">Visto ${esc(ago(seen[d.id]))}</span>`].filter(Boolean).join('');
  return (top && !rent ? `<div class="flag">${top}</div>` : '') + (rent ? `<div class="tarja${freshRent === d.id ? ' fresh' : ''}" aria-hidden="true">Alugado</div>` : '');
}
/* A ficha sem a foto: endereço | total, composição, quadro de itens e corpo.
   big = ficha ampliada (dialog): endereço é o título, descrição e "Perto daqui" já abertos. */
function sheetHtml(d, big) {
  const st = state(d), rent = rentInfo(d);
  // Bairro entra na linha de medidas; a cidade só quando a lista não está agrupada por região.
  const grouped = !big && $('fGrp').checked && !SINGLE;
  const place = grouped ? (d.regiao || '').startsWith(d.bairro || '\u0000') ? '' : d.bairro : [d.bairro, d.cidade].filter(Boolean).join(', ');
  const spec = [place, d.area && d.area + ' m²', d.quartos && d.quartos + (d.quartos > 1 ? ' quartos' : ' quarto'), d.banheiros && d.banheiros + (d.banheiros > 1 ? ' banheiros' : ' banheiro'), d.vagas && d.vagas + (d.vagas > 1 ? ' vagas' : ' vaga')].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join(' · ');
  const isFav = st === 'fav', isDesc = st === 'desc', drop = dropShown(d);
  const am = (d.amenities || []).filter(x => !/m²|quarto|banheiro|vaga|suíte|andar|aceita animais/i.test(x)).slice(0, big ? 40 : 12).join(' · ');
  const srcs = [d.source, ...(d.alt_urls || []).map(x => x.source)].map(s => SRC[s] || s).join(' + ');
  const street = d.street || (d.addr || '').split(' - ')[0] || d.bairro || '';
  const id = esc(d.id), dis = rent ? ' disabled' : '';
  const addr = big ? `<h2 class="addr" id="fx-addr">${esc(street)}</h2>`
    : `<h3 class="addr" id="ad-${id}"><button class="addr-open" type="button" data-k="${id}:open" onclick="openFicha('${id}')">${esc(street)}<span class="sr">: abrir a ficha com fotos maiores</span></button></h3>`;

  const { error } = off ? await sb.from('marks').delete().eq('listing_id', id) : await sb.from('marks').upsert(marks[id]);
  if (error) { if (prev) marks[id] = prev; else delete marks[id]; render(); return notify('Não deu para salvar a marcação: ' + error.message, true); }
  if (left) notify(status === 'desc' && !off ? 'Descartado.' : status === 'fav' && !off ? 'Favoritado.' : 'Marcação desfeita.', false, () => { if (prev) marks[id] = prev; else delete marks[id]; render(); (prev ? sb.from('marks').upsert(prev) : sb.from('marks').delete().eq('listing_id', id)).then(r => r.error && notify('Não deu para desfazer: ' + r.error.message, true)); });
}
/* Atualiza um card sem redesenhar a lista. Se ele saiu da aba, recolhe e o foco vai para o próximo.
   Devolve true quando o card saiu da aba. */
function update(id, act) {
  const el = $('list').querySelector(`.card[data-id="${CSS.escape(id)}"]`), d = L.find(x => x.id === id);
  if (!el || !d || view === 'alertas' || SINGLE) { render(); return false; }
  renderCounts();
  if (inView(d, view)) {
    const had = document.activeElement && el.contains(document.activeElement) ? document.activeElement.dataset.k : null;
    el.outerHTML = card(d); refreshFicha(); freshRent = null;
    if (had) { const n = $('list').querySelector(`[data-k="${CSS.escape(had)}"]`); if (n) n.focus({ preventScroll: true }); }
    return false;
  }
  const all = [...$('list').querySelectorAll('.card')], i = all.indexOf(el), next = all[i + 1] || all[i - 1];
  pendingFocus = next ? `${next.dataset.id}:${act}` : null;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { render(); return true; }
  el.style.height = el.offsetHeight + 'px'; el.classList.add('leaving');
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.height = '0px'; }));
  setTimeout(render, 280);
  return true;
}
async function toggleRent(id) {
  const prev = rentals[id];
  if (prev) delete rentals[id]; else { rentals[id] = { listing_id: id, by_email: me, at: new Date().toISOString() }; freshRent = id; }
  const left = update(id, 'rent');
  if (left && !prev) notify('Marcado como alugado: foi para Descartados.', false, () => toggleRent(id));
  const { error } = prev ? await sb.from('rentals').delete().eq('listing_id', id) : await sb.from('rentals').upsert(rentals[id]);
  if (error) { if (prev) rentals[id] = prev; else delete rentals[id]; render(); notify('Não deu para salvar: ' + error.message, true); }
}

/* ---------- visto: anúncios que esta pessoa já abriu ---------- */
async function markSeen(id) {
  if (seen[id] || !me) return;
  seen[id] = new Date().toISOString();
  const el = $('list').querySelector(`.card[data-id="${CSS.escape(id)}"]`), d = L.find(x => x.id === id);
  if (el && d) el.outerHTML = card(d);
  const { error } = await sb.from('views').upsert({ listing_id: id, email: me, at: seen[id] });
  if (error) console.warn('visto não salvo:', error.message);
}
document.addEventListener('click', e => { const a = e.target.closest('.links a'), c = a && (a.closest('.card') || (a.closest('#ficha') && fx.id && { dataset: { id: fx.id } })); if (c) markSeen(c.dataset.id); });
/* Opções do filtro de imobiliária: as que aparecem nos anúncios, da mais frequente para a menos. */
function fillAnun() {
  const n = {}; let ni = 0;
  L.forEach(d => { const a = anuncs(d); if (!a.length) ni++; a.forEach(x => { n[x] = (n[x] || 0) + 1; }); });
  const cur = $('fAnun').value || prefAnun;
  $('fAnun').innerHTML = '<option value="">Todas</option>' + Object.entries(n).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR'))
    .map(([k, c]) => `<option value="${esc(k)}">${esc(k)} (${c})</option>`).join('') + (ni ? `<option value="${NI}">Não informada (${ni})</option>` : '');
  $('fAnun').value = [...$('fAnun').options].some(o => o.value === cur) ? cur : '';
}

/* ---------- avisos ---------- */
let toastT = 0;
function notify(msg, err, undo) {
  const t = $('toast'), host = $('ficha').open ? $('ficha') : document.body;
  if (t.parentElement !== host) host.append(t); // com a ficha aberta, o aviso precisa ficar na camada dela
  t.setAttribute('role', err ? 'alert' : 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Desfazer</button>' : ''}`;
  t.classList.toggle('err', !!err); t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 9000 : undo ? 6000 : 3500);
}

/* ---------- preferências deste aparelho ---------- */
const PREF = 'apto-prefs-v1';
let prefAnun = '';
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREF) || '{}');
    if (p.reg !== undefined) $('fReg').value = p.reg;
    if (p.max) $('fMax').value = p.max;
    if (p.ord) $('fOrd').value = p.ord;
    prefAnun = p.anun || '';
    $('fGas').checked = !!p.gas; $('fGrp').checked = p.grp !== false;
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem(PREF, JSON.stringify({ reg: $('fReg').value, anun: $('fAnun').value, max: $('fMax').value, gas: $('fGas').checked, ord: $('fOrd').value, grp: $('fGrp').checked })); } catch (e) {}
}

/* ---------- Buscar agora: pedido no Supabase, atendido pelo PC a cada 5 min ---------- */
let syncReq = null, syncPoll = 0;
const busyReq = r => !!r && (r.status === 'pendente' || r.status === 'rodando');
function paintSync() {
  const r = syncReq, busy = busyReq(r), b = $('syncBtn');
  b.disabled = busy; b.classList.toggle('busy', busy); b.setAttribute('aria-busy', busy);
  $('syncLbl').textContent = !busy ? 'Buscar agora' : r.status === 'rodando' ? 'Buscando…' : 'Na fila';
  let note = '', err = false;
  if (busy && r.status === 'pendente') note = Date.now() - new Date(r.requested_at) > 12 * 6e4 ? 'O PC parece desligado. A busca roda assim que ele ligar.' : 'Pedido enviado. O PC confere a cada 5 minutos e começa a busca.';
  else if (busy) note = 'Lendo as fontes. Leva alguns minutos.';
  else if (r && r.finished_at && Date.now() - new Date(r.finished_at) < 30 * 6e4) { err = r.status === 'erro'; note = err ? (r.message || 'A busca falhou.') : `Última busca ${ago(r.finished_at)}: ${r.message || 'concluída'}.`; }
  const n = $('syncNote'); n.textContent = note; n.classList.toggle('err', err);
}
async function loadSync() {
  const { data, error } = await sb.from('sync_requests').select('*').order('requested_at', { ascending: false }).limit(1);
  if (error) return;
  const prev = syncReq; syncReq = (data || [])[0] || null; paintSync();
  if (busyReq(prev) && syncReq && !busyReq(syncReq)) {
    await loadAll();
    notify(syncReq.status === 'ok' ? `Busca concluída: ${syncReq.message || 'lista atualizada'}.` : (syncReq.message || 'A busca falhou.'), syncReq.status === 'erro');
  }
  clearTimeout(syncPoll);
  if (busyReq(syncReq)) syncPoll = setTimeout(loadSync, DEMO ? 2500 : 30000);
}
async function requestSync() {
  const { error } = await sb.from('sync_requests').insert({ requested_by: me });
  if (error) return notify('Não deu para pedir a busca: ' + error.message, true);
  await loadSync();
}
$('syncBtn').addEventListener('click', requestSync);

/* ---------- dados ---------- */
function setSync(msg, err) { const s = $('sync'); s.textContent = msg; s.classList.toggle('err', !!err); }
async function loadAlerts() { const { data } = await sb.from('alerts').select('*').order('created_at'); alerts = data || []; }
async function loadAll() {
  setSync('Carregando…');
  const [ls, ms, rt, rs, vs] = await Promise.all([
    sb.from('listings').select('*').order('first_seen', { ascending: false }).limit(3000),
    sb.from('marks').select('*'), sb.from('rentals').select('*'),
    sb.from('runs').select('source,status,finished_at,message').order('started_at', { ascending: false }).limit(30),
    sb.from('views').select('listing_id,at'),
  ]);
  if (ls.error) return setSync('Não foi possível carregar os anúncios: ' + ls.error.message, true);
  marks = Object.fromEntries((ms.data || []).map(m => [m.listing_id, m]));
  rentals = Object.fromEntries((rt.data || []).map(m => [m.listing_id, m]));
  seen = Object.fromEntries((vs.data || []).map(v => [v.listing_id, v.at]));
  const cutoff = Date.now() - 45 * DAY;
  L = (ls.data || []).filter(d => d.active || marks[d.id] || rentals[d.id] || new Date(d.inactive_at || 0).getTime() > cutoff);
  await loadAlerts();
  fillAnun();
  const last = {};
  (rs.data || []).forEach(r => { if (!last[r.source]) last[r.source] = r; });
  $('status').innerHTML = Object.values(last).map(r => `<span><i class="dot${r.status === 'ok' ? '' : ' bad'}"></i>${esc(SRC[r.source] || r.source)} ${r.status === 'ok' ? 'lido ' + ago(r.finished_at) : esc(r.status)}</span>`).join('') || '<span>O watcher ainda não rodou.</span>';
  setSync(DEMO ? 'Modo demonstração: dados da migração, marcações salvas só neste navegador, sem Telegram.' : '');
  render();
}
function subscribe() {
  sb.channel('sync_requests').on('postgres_changes', { event: '*', schema: 'public', table: 'sync_requests' }, () => loadSync()).subscribe();
  for (const t of ['marks', 'rentals']) sb.channel(t).on('postgres_changes', { event: '*', schema: 'public', table: t }, p => {
    const store = t === 'marks' ? marks : rentals;
    if (p.eventType === 'DELETE') delete store[p.old.listing_id]; else store[p.new.listing_id] = p.new;
    if (!editing) render();
  }).subscribe();
}

/* Ficha ampliada: toque em qualquer parte do card que não seja um controle abre a ficha. */
$('list').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (!c || e.target.closest('button,a,summary,details,input,select,label,.rentnote') || String(getSelection())) return;
  const img = e.target.closest('.ph img');
  openFicha(c.dataset.id, img ? [...img.parentElement.children].indexOf(img) : undefined);
});
$('ficha').addEventListener('click', e => { if (e.target === e.currentTarget) closeFicha(); }); // fundo escuro (desktop)
$('ficha').addEventListener('keydown', e => {
  if ((e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') || e.target.closest('input,select,textarea,.fx-sheet')) return;
  e.preventDefault(); goPhoto(fx.i + (e.key === 'ArrowRight' ? 1 : -1));
});
let fxScroll = 0;
$('ficha').addEventListener('scroll', e => {
  if (e.target.id !== 'fxPh') return;
  cancelAnimationFrame(fxScroll);
  fxScroll = requestAnimationFrame(() => { const s = e.target, i = Math.round(s.scrollLeft / s.clientWidth); if (i !== fx.i) { fx.i = i; paintPhoto(); } });
}, true);
window.addEventListener('resize', () => { if ($('ficha').open) goPhoto(fx.i, 'auto'); });
$('ficha').addEventListener('close', () => {
  const id = fx.id, t = $('toast');
  if (t.parentElement !== document.body) document.body.append(t);
  $('ficha').innerHTML = ''; fx.id = null;
  if (!fx.fromPop && history.state && history.state.ficha) history.back();
  fx.fromPop = false;
  const op = id && $('list').querySelector(`.card[data-id="${CSS.escape(id)}"] .addr-open`);
  if (op) op.focus({ preventScroll: true });
});
window.addEventListener('popstate', () => { if ($('ficha').open && !(history.state && history.state.ficha)) { fx.fromPop = true; closeFicha(); } });

const VIEWS = ['analise', 'semmarca', 'umban', 'fav', 'desc', 'alertas'];
if (VIEWS.includes(location.hash.slice(1))) view = location.hash.slice(1);
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { view = b.dataset.v; editing = null; openOpp = null; history.replaceState(null, '', '#' + view); render(); window.scrollTo({ top: 0 }); }));
document.querySelector('.tabs .wrap').addEventListener('keydown', e => {
  const tabs = [...document.querySelectorAll('.tab')], i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const j = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
  if (j === undefined) return;
  e.preventDefault(); const t = tabs[(j + tabs.length) % tabs.length]; t.focus(); t.click();
});
document.querySelector('.tabs .wrap').addEventListener('scroll', e => { const w = e.target; w.classList.toggle('more', w.scrollLeft + w.clientWidth < w.scrollWidth - 4); }, { passive: true });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== view) { view = v; editing = null; render(); } });
let filterTimer = 0;
const showMax = () => { const v = brl(+$('fMax').value); $('fMaxV').textContent = v; $('fMax').setAttribute('aria-valuetext', v); };
['fReg', 'fAnun', 'fGas', 'fOrd', 'fGrp'].forEach(id => $(id).addEventListener('change', () => { savePrefs(); render(); }));
$('fMax').addEventListener('input', () => { showMax(); clearTimeout(filterTimer); filterTimer = setTimeout(render, 160); });
$('fMax').addEventListener('change', () => { clearTimeout(filterTimer); savePrefs(); render(); });
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithOtp({ email: $('email').value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
  $('loginMsg').textContent = error ? 'Não deu para enviar o link: ' + error.message : 'Link enviado. Abra o e-mail neste mesmo navegador.';
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('loginView').hidden = false; return; }
  me = session.user.email;
  loadPrefs();
  $('appView').hidden = false; $('syncBtn').hidden = false;
  await loadAll();
  await loadSync();
  subscribe();
})();
</script>
