# apto-watch: o que o watcher procura e com que ritmo.
# Segredos (Supabase, Telegram) ficam no arquivo .env, nunca aqui.

# Identificação honesta do robô. Troque o link pelo do seu repositório.
user_agent: "apto-watch/0.1 (busca pessoal de aluguel; +https://github.com/cas0la/apto-watch)"

# Ritmo: uma requisição a cada N segundos, poucas páginas por busca.
delay_seconds: 6
max_pages_per_search: 20
# Páginas de detalhe lidas por execução (só em fontes automáticas que aceitam o robô).
detail_limit: 25

# Condições para um anúncio entrar na lista.
criteria:
  max_total: 3500          # aluguel + condomínio
  min_banheiros: 1        # os de 1 banheiro vão para a aba própria; alertas pedem 2 se não disserem nada
  min_vagas: 1
  regioes:                # só os bairros listados entram (lista de 25/11/2026)
    "Palhoça":
      incluir: ["Pedra Branca", "Pagani"]
    "São José":
      incluir: ["Campinas", "Kobrasol", "Barreiros", "Bela Vista"]
    "Florianópolis":
      # continente
      incluir: ["Estreito", "Capoeiras", "Abraão", "Canto", "Coloninha", "Jardim Atlântico",
      # centro e entorno, na ilha
                "Centro", "Agronômica", "Trindade", "Santa Mônica", "Itacorubi", "Córrego Grande",
                "Pantanal", "Saco dos Limões", "Carvoeira", "José Mendes", "Prainha", "Serrinha"]
      # bairros do norte e do sul da ilha que às vezes vêm com "Centro" no nome (ex.: "Ingleses Centro")
      excluir: ["Ingleses", "Canasvieiras", "Jurerê", "Lagoa", "Campeche", "Rio Vermelho", "Ribeirão", "Santo Antônio", "Barra"]
  sem_mobilia: true        # só armários de cozinha e banheiro (ver criteria.mobilia_excede)
  so_longa_duracao: true   # fora temporada e diária (ver criteria.temporada)

# Buscas. modo: auto = o watcher lê sozinho (site aceita robô identificado e o robots.txt permite);
#        assistido = o site recusa robôs; a coleta é feita pelo Claude no seu Chrome, quando você pedir,
#        e importada com `python -m watcher --ingest`. Teste de 06/11/2026.
searches:
  # Automáticas
  # Ibagy: o card não mostra banheiros. banheiros[]=2 traz 2 ou mais e banheiros[]=1 traz 1 ou mais;
  # a busca de 2+ vem antes, então o que só aparece na de 1+ fica com 1 banheiro.
  # valorlocacao=500,3500 é a faixa do aluguel (teste de 24/11/2026).
  - source: ibagy
    modo: auto
    url: "https://ibagy.com.br/busca?finalidade=aluguel&categoriagrupo=Residencial&tipo_residencial[]=apartamento&cidadebairro[]=palhoça&banheiros[]=2&vagas[]=1&valorlocacao=500,3500"
    assume: {banheiros: 2}
  - source: ibagy
    modo: auto
    url: "https://ibagy.com.br/busca?finalidade=aluguel&categoriagrupo=Residencial&tipo_residencial[]=apartamento&cidadebairro[]=palhoça&banheiros[]=1&vagas[]=1&valorlocacao=500,3500"
    assume: {banheiros: 1}
  - source: ibagy
    modo: auto
    url: "https://ibagy.com.br/busca?finalidade=aluguel&categoriagrupo=Residencial&tipo_residencial[]=apartamento&cidadebairro[]=sao-jose&banheiros[]=2&vagas[]=1&valorlocacao=500,3500"
    assume: {banheiros: 2}
  - source: ibagy
    modo: auto
    url: "https://ibagy.com.br/busca?finalidade=aluguel&categoriagrupo=Residencial&tipo_residencial[]=apartamento&cidadebairro[]=sao-jose&banheiros[]=1&vagas[]=1&valorlocacao=500,3500"
    assume: {banheiros: 1}
  - source: ibagy
    modo: auto
    url: "https://ibagy.com.br/busca?finalidade=aluguel&categoriagrupo=Residencial&tipo_residencial[]=apartamento&cidadebairro[]=florianopolis&banheiros[]=2&vagas[]=1&valorlocacao=500,3500"
    assume: {banheiros: 2}
  - source: ibagy
    modo: auto
    url: "https://ibagy.com.br/busca?finalidade=aluguel&categoriagrupo=Residencial&tipo_residencial[]=apartamento&cidadebairro[]=florianopolis&banheiros[]=1&vagas[]=1&valorlocacao=500,3500"
    assume: {banheiros: 1}
    max_pages: 30
  # QuintoAndar: só a primeira página vem no HTML; uma busca por número de banheiros para caber mais.
  - source: quintoandar
    modo: auto
    url: "https://www.quintoandar.com.br/alugar/imovel/palhoca-sc-brasil/apartamento/1-vagas/2-banheiros/de-500-a-3500-reais"
  - source: quintoandar
    modo: auto
    url: "https://www.quintoandar.com.br/alugar/imovel/palhoca-sc-brasil/apartamento/1-vagas/1-banheiros/de-500-a-3500-reais"
  - source: quintoandar
    modo: auto
    url: "https://www.quintoandar.com.br/alugar/imovel/sao-jose-sc-brasil/apartamento/1-vagas/2-banheiros/de-500-a-3500-reais"
  - source: quintoandar
    modo: auto
    url: "https://www.quintoandar.com.br/alugar/imovel/sao-jose-sc-brasil/apartamento/1-vagas/1-banheiros/de-500-a-3500-reais"
  - source: quintoandar
    modo: auto
    url: "https://www.quintoandar.com.br/alugar/imovel/florianopolis-sc-brasil/apartamento/1-vagas/2-banheiros/de-500-a-3500-reais"
  - source: quintoandar
    modo: auto
    url: "https://www.quintoandar.com.br/alugar/imovel/florianopolis-sc-brasil/apartamento/1-vagas/1-banheiros/de-500-a-3500-reais"
  # Isci (Palhoça): a busca é um POST que devolve JSON; os filtros vão na query (banheiros, vagas, quartos).
  - source: isci
    modo: auto
    url: "https://www.isciimoveis.com.br/aluguel/apartamento?banheiros=1&vagas=1"

  # Assistidas (recusaram robô identificado: HTTP 403/429)
  - source: vivareal
    modo: assistido
    url: "https://www.vivareal.com.br/aluguel/santa-catarina/palhoca/bairros/pedra-branca/apartamento_residencial/?banheiros=1,2,3,4&vagas=1,2,3,4&precoMaximo=3500"
  - source: vivareal
    modo: assistido
    url: "https://www.vivareal.com.br/aluguel/santa-catarina/palhoca/bairros/pagani/apartamento_residencial/?banheiros=1,2,3,4&vagas=1,2,3,4&precoMaximo=3500"
  - source: vivareal
    modo: assistido
    url: "https://www.vivareal.com.br/aluguel/santa-catarina/sao-jose/apartamento_residencial/?banheiros=1,2,3,4&vagas=1,2,3,4&precoMaximo=3500"
  - source: vivareal
    modo: assistido
    url: "https://www.vivareal.com.br/aluguel/santa-catarina/florianopolis/apartamento_residencial/?banheiros=1,2,3,4&vagas=1,2,3,4&precoMaximo=3500"
  # OLX: pe = preço máximo do aluguel, bas = banheiros a partir de, gsp = vagas a partir de (teste de 16/11/2026).
  - source: olx
    modo: assistido
    url: "https://www.olx.com.br/imoveis/aluguel/apartamentos/estado-sc/florianopolis-e-regiao/grande-florianopolis/palhoca?pe=3500&bas=1&gsp=1"
  - source: olx
    modo: assistido
    url: "https://www.olx.com.br/imoveis/aluguel/apartamentos/estado-sc/florianopolis-e-regiao/grande-florianopolis/sao-jose?pe=3500&bas=1&gsp=1"
  - source: olx
    modo: assistido
    url: "https://www.olx.com.br/imoveis/aluguel/apartamentos/estado-sc/florianopolis?pe=3500&bas=1&gsp=1"
  # Crédito Real (creditoreal.com.br) recusou com HTTP 429; Adriano Imóveis proíbe robôs no robots.txt.
  # Brognoli (brognoli.com.br) só anuncia venda: /alugar redireciona para /venda (teste de 16/11/2026).
